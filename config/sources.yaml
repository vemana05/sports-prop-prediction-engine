# Source registry (Section 4.1). The ingestion runner reads this file;
# if a `priority: primary` source fails, it falls back to the next-priority
# source that provides the same data type and logs the fallback.
#
# Only Phase 1 (NBA data foundation) sources are registered so far.
# NFL sources, odds sources, and premium upgrades are added in later phases.

- name: nba_api
  league: nba
  provides: [player_game_logs, player_list]
  priority: primary
  refresh: "daily"
  rate_limit_per_min: 20
  auth_env_var: null
  license: "unofficial stats.nba.com wrapper; no redistribution terms published"
  module: backend.ingest.nba_nbaapi

- name: pbpstats
  league: nba
  provides: [possessions, lineups, onoff]
  priority: primary
  refresh: "daily"
  rate_limit_per_min: 20
  auth_env_var: null
  license: "MIT"
  module: backend.ingest.nba_pbpstats

- name: nbainjuries
  league: nba
  provides: [injuries]
  priority: primary
  refresh: "every 15m on game days"
  rate_limit_per_min: 20
  auth_env_var: null
  license: "MIT; source data is NBA official injury reports"
  module: backend.ingest.injuries_nba_official

- name: nba_schedule
  league: nba
  provides: [schedule, tipoff_times]
  priority: primary
  refresh: "daily"
  rate_limit_per_min: 20
  auth_env_var: null
  license: "unofficial stats.nba.com wrapper; no redistribution terms published"
  module: backend.ingest.nba_schedule

- name: nba_box_status
  league: nba
  provides: [player_availability]
  priority: primary
  refresh: "daily"
  rate_limit_per_min: 20
  auth_env_var: null
  license: "unofficial stats.nba.com wrapper; no redistribution terms published"
  module: backend.ingest.nba_box_status
  note: "run() is resumable/incremental (only processes game_ids not yet in nba_box_status); fine for the daily runner once the initial backfill is done. The initial backfill itself should use `python -m backend.ingest.nba_box_status --backfill`, which writes to its own separate DuckDB file and merges into warehouse.duckdb on completion — see the module docstring."

- name: sleeper
  league: [nba, nfl]
  provides: [player_status, depth_chart, trending]
  priority: secondary
  refresh: "hourly"
  rate_limit_per_min: 1000
  auth_env_var: null
  license: "public API, no published license"
  module: backend.ingest.sleeper

- name: odds_theoddsapi
  league: nba
  provides: [odds, player_props]
  priority: primary
  refresh: "daily"
  rate_limit_per_min: 10
  auth_env_var: ODDS_API_KEY
  license: "commercial API, free tier only (500 credits/mo) — see Section 5.7"
  module: backend.ingest.odds_theoddsapi
  note: "no-ops cleanly with a warning if ODDS_API_KEY is unset; credit-budget-guarded, see ODDS_API_MONTHLY_CREDIT_BUDGET"
