services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./reports:/app/reports
    command: ["python", "-m", "backend.ingest.runner"]

